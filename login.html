<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Ism sawki</title>
  <link rel="stylesheet" href="login.css">
  <script src="validation.js" defer></script>
</head>
<body>
  <main class="login-page">
    <a class="brand" href="index.html"><span class="brand-mark">I</span><span>ISM SAWKI</span></a>
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">Bienvenue</p>
      <h1 id="login-title"> ISM SAWKI</h1>
      </h1>
      <form action="#" method="post">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="form-group">
          <input type="password" id="password" name="password" autocomplete="current-password" minlength="8" required>
        </div>
        <label class="remember"><input type="checkbox" name="remember"><span>Remember me</span></label>
        <button type="submit">Connecter</button>
        <div class="password-label"><label for="password">Password</label><a href="#Mot-de-passe-oublié">Mot de passe oublié?</a></div>
      </form>
      <p class="register">Vou n'avez pas de compte? <a href="registration.html">Créer un compte</a></p>
    </section>
  </main>
</body>
</html>
