<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>intermediate css</title>
.join-botton {
  
}

  <style>
    .join-botton:hover {
      background-color: blue;
      color: white;
      cursor: pointer;
    }

    join-botton:active{
      background-color: gray;
      color: red;
    }

    .subscibe-botton{
      background-color: blue;
      color: white;
      cursor: pointer;
    }

    .subscibe-botton:hover {
      opacity: 0.5;
    }

    .transition-botton {
      background-color: red;
      color: white;
    }

    .transition-botton:hover {
      background-color: blue;
      color: fuchsia;
      box-shadow: 3px 4px 5 px blue;
      transition: background-color 1s;
      transition: color 2s;
    }
  </style>
</head>
<body>  
  <button class="join-botton">
    join
  </button>

  <button class="subscibe-botton">subscibe</button>
  <button class="transition-botton">transition</button>
</body>
</html>
